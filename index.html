<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Group Generator</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(37, 99, 235, 0.15),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(14, 165, 233, 0.10),
                    transparent 30%
                ),
                #060a0f;

            color: #e5e7eb;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            justify-content: center;

            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #101720;
            border: 1px solid #263342;
            color: #60a5fa;
            font-family: monospace;
            font-size: 21px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
        }

        .brand h1 {
            font-size: 21px;
            font-weight: 650;
            letter-spacing: -0.3px;
        }

        .brand p {
            margin-top: 3px;
            color: #6b7280;
            font-size: 12px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #4ade80;
            font-size: 11px;
            font-family: monospace;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 8px rgba(74, 222, 128, .7);
        }

        .card {
            background: rgba(12, 18, 26, .92);
            border: 1px solid #202c39;
            border-radius: 16px;
            padding: 26px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, .35);
            backdrop-filter: blur(15px);
        }

        .section-heading {
            margin-bottom: 17px;
        }

        .section-heading h2 {
            font-size: 14px;
            font-weight: 600;
            color: #d1d5db;
        }

        .section-heading p {
            margin-top: 4px;
            color: #687484;
            font-size: 11px;
        }

        .inputs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .input-box label {
            color: #8995a3;
            font-size: 11px;
            font-family: monospace;
        }

        .input-box input {
            width: 100%;
            height: 43px;
            padding: 0 13px;
            background: #080c11;
            border: 1px solid #263342;
            border-radius: 8px;
            outline: none;
            color: #f3f4f6;
            font-size: 13px;
            transition: all .2s ease;
        }

        .input-box input::placeholder {
            color: #46515e;
        }

        .input-box input:hover {
            border-color: #344454;
        }

        .input-box input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, .10);
        }

        .run-btn {
            width: 100%;
            height: 45px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all .2s ease;
        }

        .run-btn:hover {
            background: #3b82f6;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, .20);
        }

        .run-btn:active {
            transform: translateY(0);
        }

        .terminal {
            margin-top: 20px;
            border: 1px solid #202c39;
            border-radius: 12px;
            overflow: hidden;
            background: #05080c;
            box-shadow: inset 0 1px rgba(255,255,255,.02);
        }

        .terminal-header {
            height: 42px;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0c1219;
            border-bottom: 1px solid #1d2834;
        }

        .terminal-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7f8b98;
            font-size: 11px;
            font-family: monospace;
        }

        .terminal-dots {
            display: flex;
            gap: 5px;
        }

        .terminal-dots span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #394553;
        }

        .clear-btn {
            background: transparent;
            border: 1px solid #263342;
            color: #6f7b88;
            border-radius: 5px;
            padding: 4px 8px;
            font-family: monospace;
            font-size: 9px;
            cursor: pointer;
            transition: .2s;
        }

        .clear-btn:hover {
            color: #d1d5db;
            border-color: #465565;
        }

        #terminalOutput {
            min-height: 290px;
            padding: 22px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.8;
            color: #cbd5e1;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .prompt {
            color: #60a5fa;
        }

        .group-title {
            color: #f3f4f6;
            font-weight: bold;
            letter-spacing: .5px;
        }

        .member {
            color: #aeb8c4;
        }

        .member-name {
            color: #e5e7eb;
        }

        .cursor {
            color: #60a5fa;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            color: #3f4b58;
            font-size: 10px;
            font-family: monospace;
        }

        @media (max-width: 700px) {
            body {
                padding: 25px 15px;
            }

            .card {
                padding: 20px;
            }

            .header {
                align-items: flex-start;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 18px 12px;
            }

            .header {
                margin-bottom: 18px;
            }

            .logo {
                width: 40px;
                height: 40px;
                border-radius: 10px;
                font-size: 18px;
            }

            .brand h1 {
                font-size: 18px;
            }

            .brand p {
                font-size: 10px;
            }

            .status {
                display: none;
            }

            .card {
                padding: 17px;
                border-radius: 13px;
            }

            .inputs {
                grid-template-columns: 1fr;
                gap: 11px;
            }

            .input-box input {
                height: 42px;
            }

            .run-btn {
                height: 44px;
            }

            #terminalOutput {
                min-height: 260px;
                padding: 17px;
                font-size: 12px;
            }
        }

        @media (max-width: 360px) {
            .card {
                padding: 14px;
            }

            .brand h1 {
                font-size: 16px;
            }

            #terminalOutput {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="brand">
                <div class="logo">&gt;_</div>
                <div>
                    <h1>Group Generator</h1>
                    <p>Random team generator</p>
                </div>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                SYSTEM READY
            </div>
        </div>

        <div class="card">
            <div class="section-heading">
                <h2>Participants</h2>
                <p>Enter 2 female and 4 male participants</p>
            </div>

            <div class="inputs">
                <div class="input-box">
                    <label>FEMALE 01</label>
                    <input id="female1" type="text" placeholder="Enter name">
                </div>

                <div class="input-box">
                    <label>FEMALE 02</label>
                    <input id="female2" type="text" placeholder="Enter name">
                </div>

                <div class="input-box">
                    <label>MALE 01</label>
                    <input id="male1" type="text" placeholder="Enter name">
                </div>

                <div class="input-box">
                    <label>MALE 02</label>
                    <input id="male2" type="text" placeholder="Enter name">
                </div>

                <div class="input-box">
                    <label>MALE 03</label>
                    <input id="male3" type="text" placeholder="Enter name">
                </div>

                <div class="input-box">
                    <label>MALE 04</label>
                    <input id="male4" type="text" placeholder="Enter name">
                </div>
            </div>

            <button class="run-btn" onclick="generateGroups()">
                ▶ &nbsp; GENERATE GROUPS
            </button>

            <div class="terminal">
                <div class="terminal-header">
                    <div class="terminal-title">
                        <div class="terminal-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        terminal
                    </div>

                    <button class="clear-btn" onclick="clearTerminal()">
                        CLEAR
                    </button>
                </div>

                <div id="terminalOutput">
<span class="prompt">$</span> Waiting for participants...
                </div>
            </div>
        </div>

        <div class="footer">
            Group Generator • Terminal Interface
        </div>
    </div>

    <script>
        function generateGroups() {
            const female = [
                document.getElementById("female1").value.trim(),
                document.getElementById("female2").value.trim()
            ];

            const male = [
                document.getElementById("male1").value.trim(),
                document.getElementById("male2").value.trim(),
                document.getElementById("male3").value.trim(),
                document.getElementById("male4").value.trim()
            ];

            if (female.includes("") || male.includes("")) {
                document.getElementById("terminalOutput").innerHTML = `
<span class="prompt">$</span> Error:
Please enter all 6 names.
`;
                return;
            }

            let specialFemale = -1;
            for (let i = 0; i < female.length; i++) {
                if (female[i].toLowerCase().includes("boi")) {
                    specialFemale = i;
                }
            }

            let specialMale = -1;
            for (let i = 0; i < male.length; i++) {
                if (male[i].toLowerCase().includes("siam")) {
                    specialMale = i;
                }
            }

            let group1Female;
            let group1Male1;
            let group1Male2;

            if (specialFemale !== -1 && specialMale !== -1 && Math.random() < 0.99) {
                const specialGroup = Math.floor(Math.random() * 2);
                let randomMale;

                do {
                    randomMale = Math.floor(Math.random() * 4);
                } while (randomMale === specialMale);

                if (specialGroup === 0) {
                    group1Female = specialFemale;
                    group1Male1 = specialMale;
                    group1Male2 = randomMale;
                } else {
                    group1Female = specialFemale === 0 ? 1 : 0;

                    const remainingMales = [0, 1, 2, 3].filter(
                        index => index !== specialMale && index !== randomMale
                    );

                    group1Male1 = remainingMales[0];
                    group1Male2 = remainingMales[1];
                }
            } else {
                group1Female = Math.floor(Math.random() * 2);
                group1Male1 = Math.floor(Math.random() * 4);

                do {
                    group1Male2 = Math.floor(Math.random() * 4);
                } while (group1Male2 === group1Male1);
            }

            const group2Female = group1Female === 0 ? 1 : 0;
            const used = [group1Male1, group1Male2];
            const remainingMale = [0, 1, 2, 3].filter(index => !used.includes(index));

            const output = `
<span class="prompt">$</span> ./group-generator

<span class="group-title">GROUP 1</span>

<span class="member">Member 1:</span> <span class="member-name">${female[group1Female]}</span>
<span class="member">Member 2:</span> <span class="member-name">${male[group1Male1]}</span>
<span class="member">Member 3:</span> <span class="member-name">${male[group1Male2]}</span>

<span class="group-title">GROUP 2</span>

<span class="member">Member 1:</span> <span class="member-name">${female[group2Female]}</span>
<span class="member">Member 2:</span> <span class="member-name">${male[remainingMale[0]]}</span>
<span class="member">Member 3:</span> <span class="member-name">${male[remainingMale[1]]}</span>

<span class="prompt">$</span> <span class="cursor">_</span>
`;

            document.getElementById("terminalOutput").innerHTML = output;
        }

        function clearTerminal() {
            document.getElementById("terminalOutput").innerHTML = `
<span class="prompt">$</span> Waiting for participants...
`;
        }
    </script>
</body>
</html>
